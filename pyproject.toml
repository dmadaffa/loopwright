[project]
name = "loopwright"
# Placeholder: the release version lives in .claude-plugin/plugin.json.
version = "0"
description = "Tooling for developing the loopwright plugin: its tests and linter. The plugin itself needs only Python 3.10+ and git."
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
# The floor from requires-python: ruff's fixes must not use newer syntax.
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "BLE", "FURB"]
